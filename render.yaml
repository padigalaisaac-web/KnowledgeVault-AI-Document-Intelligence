# ============================================================
# Render Blueprint Specification for KnowledgeVault AI
# Documentation: https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: knowledgevault-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # or free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: mock # options: mock, openai, anthropic, gemini, ollama
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: 700
      - key: CHUNK_OVERLAP
        value: 100
      - key: TOP_K
        value: 5
      - key: RRF_K
        value: 60
      - key: SIMILARITY_THRESHOLD
        value: 0.20
      - key: PYTHONUNBUFFERED
        value: 1
      # Optional external API keys (configure in Render Dashboard)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

    # Persistent disk for SQLite database and uploaded research papers
    # Note: Render Disks require a paid plan (e.g. Starter $7/mo).
    # On Render Free Tier without a disk, uploads persist in memory/container until restart.
    disk:
      name: knowledgevault-storage
      mountPath: /app/data
      sizeGB: 1
