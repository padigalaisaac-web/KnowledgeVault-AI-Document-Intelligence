services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: knowledgevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgevault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgevault} -d ${POSTGRES_DB:-knowledgevault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: knowledgevault-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: knowledgevault-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-knowledgevault}:${POSTGRES_PASSWORD:-vault_secret_password}@postgres:5432/${POSTGRES_DB:-knowledgevault}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=knowledgevault_chunks
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_MODEL=${LLM_MODEL:-mock-expert-v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - CHUNK_SIZE=700
      - CHUNK_OVERLAP=100
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.20
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
    volumes:
      - backend_uploads:/app/data/uploads
    ports:
      - "8000:8000"

  # Frontend Web UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: knowledgevault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  qdrant_data:
  backend_uploads:
